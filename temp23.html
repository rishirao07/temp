<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="root"></div>
    <img src="assets/images/ball.png" width="100px" id="ball" onclick="startFall()">
    <script>
        ball.style.position = "absolute";
        let t = 0;
        let l = 0;
        function ballFall(){
            t++;
            ball.style.top = t + "px";
            if(t>700){
                t=1;
                l = Math.random() * 500;
            }
            ball.style.top = t + "px";
            ball.style.left = l + "px";
            setTimeout(ballFall,1);
        }
        function startFall()
        {
            ballFall();
        }
    </script>
</body>
</html>
